<title>Реестр броней · заливка по оплате · Light Rental</title>
<!--
  ============================================================================
  МОКАП · РЕЕСТР БРОНЕЙ (/bookings) · ЗАЛИВКА СТРОК ПО ОПЛАТЕ

  Просьба владельца (04.10.2026): оплаченные брони — бледно-зелёной заливкой,
  неоплаченные — бледно-красной, чтобы оплату было видно с первого взгляда.

  Страница — копия текущего реестра (BookingRegister.tsx, RegisterCells.tsx,
  RegisterPayment.tsx) на тех же классах Tailwind и тех же токенах темы:
  стили собраны из apps/web/tailwind.config.js + app/globals.css. Новое —
  только тон строки/карточки и легенда «Оплачено · Есть остаток» над таблицей.
  Брони, клиенты и суммы вымышлены. Сегодня — воскресенье, 4 октября 2026.

  ПРАВИЛО ЦВЕТА (только у состоявшихся броней: подтверждена, выдана, возвращена)
   · зелёный  — долга нет: «Оплачено», «Расчёт со списанием», «Аванс / переплата»;
   · красный  — есть остаток: «Не оплачено», «Частично оплачено» (и просрочка);
   · без тона — черновик, на согласовании, отменённая; сумма 0, не рассчитано,
                нет начислений. Здесь «не оплачено» ничего не значит: денег
                никто не ждёт, а красный приучил бы его не замечать.

  КЛАССЫ (зеркалить в коде)
   строка   оплачено   bg-emerald-soft/60 hover:bg-emerald-soft
                       dark:bg-emerald-soft dark:hover:bg-emerald-border/60
            остаток    bg-rose-soft/70 hover:bg-rose-soft
                       dark:bg-rose-soft dark:hover:bg-rose-border/60
            без тона   hover:bg-surface-subtle/50 (как сейчас)
   карточка оплачено   border-emerald-border bg-emerald-soft/60 dark:bg-emerald-soft
            остаток    border-rose-border bg-rose-soft/70 dark:bg-rose-soft
   Розовый слабее зелёного по яркости, поэтому его доля выше (70 против 60) —
   иначе на ярком офисном мониторе красные строки сливаются с белыми.
   Ночью мягкие тона и так тёмные подложки — берём их целиком.

  СОСТОЯНИЯ
   · выбранная строка сохраняет свой тон, выбор показывает синяя полоса слева
     (раньше выбор красил строку в бледно-синий и стёр бы цвет оплаты);
   · с «Начислено и получено» колонка «Действия» закреплена справа и
     непрозрачна — её фон повторяет тон строки (surface + градиент тона);
   · карточки — те же правила: телефон, планшет и экран до 1280 px, «Доска» и
     правая колонка «Пульта дня» (они рисуют ту же карточку).

  Переключатели внизу страницы: тема, «с заливкой / как сейчас».
  ?clean — без переключателей (для скриншотов), ?theme=dark, ?tint=off.
  ============================================================================
-->

/* ── Форматирование, как в lib/format.ts и register/model.ts ──────────── */
const rub = (n) => new Intl.NumberFormat("ru-RU", { style: "currency", currency: "RUB",
  minimumFractionDigits: Math.round(n * 100) === Math.round(n) * 100 ? 0 : 2, maximumFractionDigits: 2 }).format(n);
function regDate(v, time) {
  if (!v) return "Не задан";
  const d = new Date(v.length === 10 ? v + "T12:00:00+03:00" : v);
  return d.toLocaleString("ru-RU", { timeZone: "Europe/Moscow", day: "2-digit", month: "short", year: "numeric",
    ...(time ? { hour: "2-digit", minute: "2-digit" } : {}) });
}
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const isProject = (r) => r.mode === "PROJECT";
const primaryLabel = (r) => isProject(r) ? "Закрыть период"

/* ── Ячейки ───────────────────────────────────────────────────────────── */

}
function rentalDates(r) {
  const t = !isProject(r);
  return `<div class="inline-grid grid-cols-[auto_auto] items-baseline gap-x-1.5 gap-y-1 whitespace-nowrap text-left text-xs text-ink-2">

function rentalState(r) {

}
